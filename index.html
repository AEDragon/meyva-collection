function PolaroidCluster() {
  const polaroids = [
    { l: 12, t: 18, r: -10, tone: 1 },

  const ledDots = [];
  const path = [
    [4, 10], [14, 14], [26, 18], [38, 12], [50, 14], [62, 18], [74, 14], [84, 22],
    [80, 38], [70, 46], [58, 48], [46, 50], [34, 48], [22, 50], [14, 54], [20, 66],
    [32, 70], [44, 76], [56, 72], [68, 70], [78, 64], [82, 78], [70, 84], [54, 88], [40, 86], [26, 84], [14, 80],
  ];
  path.forEach((p, i) => ledDots.push({ x: p[0], y: p[1], i }));

  const wirePath = path.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ' ' + p[1]).join(' ');

  return React.createElement('div', { className: 'polaroid-cluster' },
    React.createElement('svg', {
      className: 'led-line',
      viewBox: '0 0 100 100',
      preserveAspectRatio: 'none',
      style: { width: '100%', height: '100%', position: 'absolute', inset: 0 },
    },
      React.createElement('path', {
        d: wirePath,
        stroke: '#2a2422',
        strokeWidth: '0.3',
        fill: 'none',
        opacity: '0.5',
      }),
      ledDots.map(d =>
        React.createElement('g', { key: d.i },
          React.createElement('circle', { cx: d.x, cy: d.y, r: '1.6', fill: '#f5cf6e', opacity: '0.35' }),
          React.createElement('circle', { cx: d.x, cy: d.y, r: '0.8', fill: '#fff5d4' })

    ),
    polaroids.map((p, i) =>
      React.createElement('div', {

        React.createElement('div', { className: 'polaroid-clip' }),
        React.createElement('div', { className: 'polaroid-photo tone-' + p.tone })

}

      product.teaser && React.createElement('p', { className: 'cs-teaser' }, product.teaser)
    )
  );
}

function ComingSoon() {
  const items = (window.MEYVA_DATA && window.MEYVA_DATA.COMING_SOON) || [];
  if (!items.length) return null;

  return React.createElement('section', { className: 'section coming-soon' },
    React.createElement('div', { className: 'section-head' },
      React.createElement('div', null,
        React.createElement('div', { className: 'section-eyebrow' }, 'En préparation'),
        React.createElement('h2', { className: 'section-title' },
          'Bientôt ', React.createElement('em', null, 'disponible'))
      ),
      React.createElement('a', {
        href: 'https://instagram.com/meyva__collection', target: '_blank', rel: 'noopener',
        className: 'section-link',
      }, 'Être prévenu(e) →')
    ),
    React.createElement('div', { className: 'product-grid' },
      items.map(p => React.createElement(ComingSoonCard, { key: p.id, product: p }))
    ),
    React.createElement('p', { className: 'cs-note' },
      'Ces nouveautés ne sont pas encore en vente. Écris-nous sur Instagram pour les réserver ou être prévenu(e) du lancement.')
  );
}

window.ComingSoon = ComingSoon;

// ── App ───────────────────────────────────────────────────────────────────────
const { useState } = React;

function App() {
  const [page, setPage] = useState('home');
  const [activeProduct, setActiveProduct] = useState(PRODUCTS[0]);
  const [lang, setLang] = useState('fr');
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);

  const openProduct = (p) => {
    setActiveProduct(p);
    setPage('product');
    window.scrollTo(0, 0);
  };

  const addToCart = (product, qty, option) => {
    const unitPrice = option && option.tier ? option.tier.price : product.price;
    setCart(c => [...c, { ...product, qty, option, unitPrice }]);
    setCartOpen(true);
  };
  const updateQty = (idx, qty) => setCart(c => c.map((it, i) => i === idx ? { ...it, qty } : it));
  const removeItem = (idx) => setCart(c => c.filter((_, i) => i !== idx));

  const cartCount = cart.reduce((s, i) => s + i.qty, 0);

  let content;
  if (page === 'home') content = <Home products={PRODUCTS} setPage={(p) => { setPage(p); window.scrollTo(0,0); }} openProduct={openProduct} />;
  else if (page === 'shop') content = <Shop products={PRODUCTS} categories={CATEGORIES} openProduct={openProduct} />;
  else if (page === 'product') content = <ProductDetail product={activeProduct} products={PRODUCTS} addToCart={addToCart} openProduct={openProduct} setPage={(p) => { setPage(p); window.scrollTo(0,0); }} />;
  else if (page === 'about') content = <About setPage={(p) => { setPage(p); window.scrollTo(0,0); }} />;

  return (
    <>
      <UtilityBar lang={lang} setLang={setLang} />
      <Nav page={page} setPage={(p) => { setPage(p); window.scrollTo(0,0); }} cartCount={cartCount} openCart={() => setCartOpen(true)} />
      <main data-screen-label={page}>{content}</main>
      <Footer />
      <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} cart={cart} updateQty={updateQty} removeItem={removeItem} />

      <div className="page-switcher" role="navigation" aria-label="Aperçu pages">
        {[
          { id: 'home', label: 'Accueil' },
          { id: 'shop', label: 'Boutique' },
          { id: 'product', label: 'Produit' },
          { id: 'about', label: 'À propos' },
        ].map(l => (
          <button key={l.id} className={page === l.id ? 'active' : ''} onClick={() => {
            if (l.id === 'product') setActiveProduct(PRODUCTS[0]);
            setPage(l.id);
            window.scrollTo(0, 0);
          }}>{l.label}</button>
        ))}
        <button onClick={() => setCartOpen(true)}>Panier{cartCount > 0 ? ' (' + cartCount + ')' : ''}</button>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
