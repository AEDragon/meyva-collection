function tf(map, id, field, lang, fallback) {
  if (lang === 'en' && map[id] && map[id][field] != null) return map[id][field];

function pField(p, field, lang) {
  // Si le propriétaire a saisi une version EN (name_en, desc_en…), elle est prioritaire.
  if (lang === 'en') {

    if (p && p[ek] != null && p[ek] !== '') return p[ek];
  }
  return tf(PRODUCT_I18N, p.id, field, lang, p[field]);
}

//    propriétaire (prix, noms, épuisé…), les produits ajoutés et les produits masqués. ──
function applyCatalog(base, overlay) {
  overlay = overlay || {};
  const overrides = overlay.overrides || {};
  const hidden = overlay.hidden || [];
  const custom = Array.isArray(overlay.custom) ? overlay.custom : [];
  const merged = base
    .filter(p => hidden.indexOf(p.id) === -1)
    .map(p => (overrides[p.id] ? Object.assign({}, p, overrides[p.id]) : p));
  return merged.concat(custom);
}
function deriveCategories(list) {
  const base = ['Tout', 'Packs', 'Photos', 'Stickers', 'Posters', 'Bougies', 'Cadeaux'];
  const extra = [];
  list.forEach(p => { if (p.cat && base.indexOf(p.cat) === -1 && extra.indexOf(p.cat) === -1) extra.push(p.cat); });
  return base.concat(extra);
}

// Réduit une image (redimension + JPEG) avant l'envoi — indispensable pour les
// commandes de nombreuses photos (téléphone = 3–8 Mo chacune → ~200–400 Ko ici).
async function compressImage(file, maxDim, quality) {
  if (!file || !/^image\//.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    let w = bmp.width, h = bmp.height;
    const scale = Math.min(1, maxDim / Math.max(w, h));
    w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
    const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
    if (!blob) return file;
    const base = (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg';
    return new File([blob], base, { type: 'image/jpeg' });
  } catch (e) { return file; }
}

// Miniature d'un fichier client téléversé (poster perso, sticker…).
// Les blobs sont privés : on récupère l'image avec la clé admin puis on l'affiche.
// Les PDF (ou images en cours de chargement) gardent le bouton de téléchargement.
function AdminFileThumb({ file, adminKey, openFile }) {
  const lang = useLang();
  const [url, setUrl] = React.useState('');
  const name = (file && (file.name || file.path)) || '';
  const isImage = /\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(name);
  React.useEffect(() => {
    if (!isImage || !file || !file.path) return undefined;
    let alive = true; let obj = '';
    (async () => {
      try {
        const r = await fetch('/api/orders?file=' + encodeURIComponent(file.path), {
          headers: adminKey ? { 'x-admin-key': adminKey } : {},
        });
        if (!r.ok) return;
        const blob = await r.blob();
        obj = URL.createObjectURL(blob);
        if (alive) setUrl(obj); else URL.revokeObjectURL(obj);
      } catch (e) { /* on retombe sur le bouton de téléchargement */ }
    })();
    return () => { alive = false; if (obj) URL.revokeObjectURL(obj); };
  }, [isImage, file && file.path, adminKey]);
  if (isImage) {
    return React.createElement('a', {
      href: url || undefined, download: name || true,
      className: 'admin-design-thumb' + (url ? '' : ' loading'), title: name,
      onClick: (e) => { e.preventDefault(); openFile(file.path, name); },
    }, url
      ? React.createElement('img', { src: url, alt: name, loading: 'lazy' })
      : React.createElement('span', { className: 'thumb-load' }, '⏳'));
  }
  return React.createElement('button', {
    className: 'btn-file', onClick: () => openFile(file.path, name), title: name,
  }, '📎 ' + t(lang, 'ad_file'));
}

function SearchOverlay({ open, onClose, products, openProduct }) {
  const lang = useLang();
  const [q, setQ] = React.useState('');
  const inputRef = React.useRef(null);
  React.useEffect(() => {
    if (open && inputRef.current) inputRef.current.focus();
    if (!open) setQ('');
    const esc = (e) => { if (e.key === 'Escape') onClose(); };
    if (open) window.addEventListener('keydown', esc);
    return () => window.removeEventListener('keydown', esc);
  }, [open]);
  if (!open) return null;
  const ql = q.trim().toLowerCase();
  const hit = (p) => [pField(p, 'name', lang), p.name, catLabel(p.cat, lang), pField(p, 'desc', lang)]
    .some(s => (s || '').toLowerCase().indexOf(ql) !== -1);
  const results = ql ? products.filter(p => !p.promoOnly && hit(p)) : [];
  return React.createElement('div', { className: 'search-overlay', onClick: onClose },
    React.createElement('div', { className: 'search-box', onClick: e => e.stopPropagation() },
      React.createElement('input', {
        ref: inputRef, className: 'search-input', placeholder: t(lang, 'search_ph'),
        value: q, onChange: e => setQ(e.target.value),
      }),
      ql && (results.length
        ? React.createElement('div', { className: 'search-results' },
            results.map(p => React.createElement('button', { key: p.id, className: 'search-result', onClick: () => openProduct(p) },
              p.image
                ? React.createElement('img', { src: p.image, alt: '', className: 'search-thumb' })
                : React.createElement('span', { className: 'search-thumb' }),
              React.createElement('span', { className: 'search-name' }, pField(p, 'name', lang)),
              React.createElement('span', { className: 'search-price' }, p.tiers ? t(lang, 'price_from') + ' ' + window.money(p.fromPrice) : window.money(p.price))
            )))
        : React.createElement('p', { className: 'muted', style: { padding: '14px 6px' } }, t(lang, 'search_none')))
    )
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
const { useState } = React;

function App() {
  const [page, setPage] = useState('home');
  const [activeProduct, setActiveProduct] = useState(PRODUCTS[0]);
  const [lang, setLangState] = useState(() => {
    try { return localStorage.getItem('meyva_lang') === 'en' ? 'en' : 'fr'; } catch (e) { return 'fr'; }
  });
  const setLang = (l) => {
    setLangState(l);
    try { localStorage.setItem('meyva_lang', l); } catch (e) {}
    try { document.documentElement.lang = l; } catch (e) {}
  };
  React.useEffect(() => { try { document.documentElement.lang = lang; } catch (e) {} }, [lang]);

  // Mode sombre (clair par défaut), mémorisé sur l'appareil
  const [theme, setThemeState] = useState(() => {
    try { return localStorage.getItem('meyva_theme') === 'dark' ? 'dark' : 'light'; } catch (e) { return 'light'; }
  });
  const toggleTheme = () => {
    setThemeState(prev => {
      const next = prev === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('meyva_theme', next); } catch (e) {}
      return next;
    });
  };
  React.useEffect(() => {
    try { document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light'); } catch (e) {}
  }, [theme]);

  // Catalogue effectif = PRODUCTS de base + modifications du propriétaire (API).
  const [overlay, setOverlay] = useState(null);
  const reloadCatalog = React.useCallback(() => {
    return fetch('/api/products', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(j => { if (j && j.catalog) setOverlay(j.catalog); return j && j.catalog; })
      .catch(() => null);
  }, []);
  React.useEffect(() => { reloadCatalog(); }, [reloadCatalog]);
  const catalog = React.useMemo(() => window.applyCatalog(PRODUCTS, overlay), [overlay]);
  const categories = React.useMemo(() => window.deriveCategories(catalog), [catalog]);
  const news = (overlay && Array.isArray(overlay.news)) ? overlay.news : [];
  const events = (overlay && Array.isArray(overlay.events)) ? overlay.events : [];
  // Garde activeProduct à jour si ses infos ont changé (prix, épuisé…)
  React.useEffect(() => {
    setActiveProduct(prev => (prev ? (catalog.find(p => p.id === prev.id) || prev) : prev));
  }, [catalog]);

  // Admin masqué pour les clients : accessible via le lien secret #admin (ou si
  // le code d'accès est déjà mémorisé sur cet appareil).
  const [showAdmin, setShowAdmin] = useState(() => {
    try { return (window.location.hash || '').replace('#', '').toLowerCase() === 'admin'; } catch (e) { return false; }
  });
  React.useEffect(() => {
    const applyHash = () => {
      try {
        if ((window.location.hash || '').replace('#', '').toLowerCase() === 'admin') {
          setShowAdmin(true); setPage('admin'); window.scrollTo(0, 0);
        }
      } catch (e) {}
    };
    applyHash();
    window.addEventListener('hashchange', applyHash);
    return () => { window.removeEventListener('hashchange', applyHash); };
  }, []);

  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const [shopCat, setShopCat] = useState('Tout');
  const [helpSection, setHelpSection] = useState(null);

  // Historique de navigation interne (boutons précédent / suivant)
  const histBack = React.useRef([]);
  const histFwd = React.useRef([]);
  const [, setNavTick] = useState(0);
  const snapshot = () => ({ page, activeProduct, shopCat, helpSection });
  const applyState = (s) => {
    setPage(s.page);
    if (s.activeProduct) setActiveProduct(s.activeProduct);
    if (s.shopCat !== undefined) setShopCat(s.shopCat);
    if (s.helpSection !== undefined) setHelpSection(s.helpSection);
    window.scrollTo(0, 0);
  };
  const navTo = (changes) => {
    histBack.current.push(snapshot());
    histFwd.current = [];
    applyState({ page, activeProduct, shopCat, helpSection, ...changes });
    setNavTick(t => t + 1);
  };
  const goBack = () => {
    if (!histBack.current.length) return;
    histFwd.current.push(snapshot());
    applyState(histBack.current.pop());
    setNavTick(t => t + 1);
  };
  const goForward = () => {
    if (!histFwd.current.length) return;
    histBack.current.push(snapshot());
    applyState(histFwd.current.pop());
    setNavTick(t => t + 1);
  };
  const canBack = histBack.current.length > 0;
  const canForward = histFwd.current.length > 0;
  const navPage = (p) => navTo({ page: p, activeProduct: p === 'product' ? catalog[0] : activeProduct });

  const openProduct = (p) => navTo({ page: 'product', activeProduct: p });
  const goShop = (cat) => navTo({ page: 'shop', shopCat: cat || 'Tout' });
  const goHelp = (sec) => navTo({ page: 'help', helpSection: sec || null });

  const addToCart = (product, qty, option) => {
    const unitPrice = option && option.unitPrice != null ? option.unitPrice
      : option && option.tier ? option.tier.price
      : product.price;
    setCart(c => [...c, { ...product, qty, option, unitPrice }]);
    setCartOpen(true);
  };
  const updateQty = (idx, qty) => setCart(c => c.map((it, i) => i === idx ? { ...it, qty } : it));
  const removeItem = (idx) => setCart(c => c.filter((_, i) => i !== idx));

  const cartCount = cart.reduce((s, i) => s + i.qty, 0);

  let content;
  if (page === 'home') content = <Home products={catalog} setPage={navPage} openProduct={openProduct} news={news} events={events} />;
  else if (page === 'shop') content = <Shop key={shopCat} products={catalog} categories={categories} openProduct={openProduct} initialCat={shopCat} />;
  else if (page === 'product') content = <ProductDetail product={activeProduct} products={catalog} addToCart={addToCart} openProduct={openProduct} setPage={navPage} />;
  else if (page === 'about') content = <About setPage={navPage} />;
  else if (page === 'help') content = <Help section={helpSection} goShop={goShop} />;
  else if (page === 'checkout') content = <Checkout cart={cart} onPlaced={() => setCart([])} setPage={navPage} />;
  else if (page === 'admin') content = <OrderAdmin catalog={catalog} reloadCatalog={reloadCatalog} />;

  const goCheckout = () => { setCartOpen(false); navTo({ page: 'checkout' }); };

  return (
    <LangContext.Provider value={lang}>
      <UtilityBar lang={lang} setLang={setLang} theme={theme} toggleTheme={toggleTheme} />
      <Nav page={page} setPage={navPage} cartCount={cartCount} openCart={() => setCartOpen(true)} openSearch={() => setSearchOpen(true)} goBack={goBack} goForward={goForward} canBack={canBack} canForward={canForward} />
      <main data-screen-label={page}>{content}</main>
      <Footer goShop={goShop} goHelp={goHelp} openProduct={openProduct} products={catalog} />
      <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} cart={cart} updateQty={updateQty} removeItem={removeItem} onCheckout={goCheckout} />
      <SearchOverlay open={searchOpen} onClose={() => setSearchOpen(false)} products={catalog} openProduct={(p) => { setSearchOpen(false); openProduct(p); }} />

      <div className="page-switcher" role="navigation" aria-label="Pages">
        {[
          { id: 'home', label: t(lang, 'nav_home') },
          { id: 'shop', label: t(lang, 'nav_shop') },
          { id: 'product', label: t(lang, 'nav_product') },
          { id: 'about', label: t(lang, 'nav_about') },
          ...(showAdmin ? [{ id: 'admin', label: t(lang, 'nav_admin') }] : []),
        ].map(l => (
          <button key={l.id} className={page === l.id ? 'active' : ''} onClick={() => navPage(l.id)}>{l.label}</button>
        ))}
        <button onClick={() => setCartOpen(true)}>{t(lang, 'nav_cart')}{cartCount > 0 ? ' (' + cartCount + ')' : ''}</button>
      </div>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
